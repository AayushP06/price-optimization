databases:
  - name: priceopt-db
    databaseName: priceopt
    user: priceopt_user
    plan: free

services:
  - type: web
    name: price-optimizer-api
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: priceopt-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
