databases:
  - name: priceopt-db
    databaseName: priceopt
    user: priceopt_user
    plan: free

services:
  - type: web
    name: price-optimizer-api
    env: python
    buildCommand: cd frontend && npm ci && npm run build && cd .. && pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app.main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: priceopt-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
